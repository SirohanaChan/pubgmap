<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <title>eDPI 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <label for="dpi">DPI</label>
    <input type="number" id="dpi" placeholder="ex) 800">
    
    <label for="sensitivity">일반 감도</label>
    <input type="number" id="sensitivity" placeholder="ex) 45">

    <label for="verticalSensitivity">수직 감도</label>
    <input type="number" id="verticalSensitivity" placeholder="ex) 1.04">

    <button onclick="calculateEDPI()">계산</button>

    <div id="result" class="hidden">eDPI</div>
  </div>
  <div class="info">
    <div id="whatisedpi">
        <h2>eDPI(Effective Dots per Inch)가 무엇인가요?</h2>
        eDPI는 "인치 당 유효 픽셀 수" 라는 의미로,
        인게임에서 마우스를 움직였을 때 실질적으로 변화하는 픽셀의 양을 의미해요.
        <br>수치가 낮을 수록 더 정밀한 조작이 가능해지죠.
        <br>배틀그라운드의 권장 eDPI는 약 200eDPI에요.
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
