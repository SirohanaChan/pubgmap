<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>PUBG MAP</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="image-list">
    <div class="row">
      <button onclick="enableMeasurement()" id="discal">위치 지정</button>
      <div id="distanceDisplay">D:</div>
    </div>
    <div class="column">
      <button onclick="loadImage('img/Erangel_Main_High_Res.webp', 8)"><img src="img/Erangel_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Miramar_Main_High_Res.webp', 8)"><img src="img/Miramar_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Taego_Main_High_Res.webp', 8)"><img src="img/Taego_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Vikendi_Main_High_Res.webp', 8)"><img src="img/Vikendi_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Rondo_Main_High_Res.webp', 8)"><img src="img/Rondo_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Deston_Main_High_Res.webp', 8)"><img src="img/Deston_banner.webp" style="width: 200px" /></button>
      <button onclick="loadImage('img/Sanhok_Main_High_Res.webp', 4)"><img src="img/Sanhok_banner.webp" style="width: 200px" /></button>
    </div>
  </div>

  <canvas id="canvas" style="touch-action: none;"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let img = new Image();
    let imgScale = 1;
    let imgX = 0, imgY = 0;
    let isDragging = false;
    let dragStartX, dragStartY;
    let measuring = false;
    let points = [];
    let mapSizeKm = 8;

    function enableMeasurement() {
        measuring = !measuring;
        points = [];
        document.getElementById('distanceDisplay').innerText = 'D:';
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawImage();
    }

    window.addEventListener('resize', resizeCanvas);

    function loadImage(src, sizeKm) {
        img.src = src;
        mapSizeKm = sizeKm;
        img.onload = () => {
            imgScale = 0.15;  // 기본 스케일 고정
            imgX = (canvas.width - img.width * imgScale) / 2;
            imgY = (canvas.height - img.height * imgScale) / 2;
            drawImage();
        };
    }

    function drawImage() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(imgX, imgY);
        ctx.scale(imgScale, imgScale);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
        drawPoints();
    }

    function drawPoints() {
        ctx.save();
        ctx.translate(imgX, imgY);
        ctx.scale(imgScale, imgScale);
        ctx.fillStyle = 'blue';
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2 / imgScale;

        points.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5 / imgScale, 0, 2 * Math.PI);
            ctx.fill();

            if (i === 1) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.stroke();
            }
        });
        ctx.restore();
    }

    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX - imgX;
        dragStartY = e.clientY - imgY;
        canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isDragging) {
            imgX = e.clientX - dragStartX;
            imgY = e.clientY - dragStartY;
            drawImage();
        }
    });

    canvas.addEventListener('mouseup', () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
    });

    canvas.addEventListener('mouseleave', () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
    });

    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const scaleFactor = 1.1;
        const delta = e.deltaY < 0 ? 1 : -1;
        const zoom = Math.pow(scaleFactor, delta);

        const mouseX = e.clientX;
        const mouseY = e.clientY;
        const x = (mouseX - imgX) / imgScale;
        const y = (mouseY - imgY) / imgScale;

        const newScale = imgScale * zoom;
        if (newScale < 0.1 || newScale > 10) return;

        imgX -= (x * newScale - x * imgScale);
        imgY -= (y * newScale - y * imgScale);
        imgScale = newScale;

        drawImage();
    });

    canvas.addEventListener('click', (e) => {
    if (!measuring) return;

    const canvasX = (e.clientX - imgX) / imgScale;
    const canvasY = (e.clientY - imgY) / imgScale;

    if (points.length >= 2) {
        // 두 점이 찍혔다면 새 측정 시작
        points = [];
        document.getElementById('distanceDisplay').innerText = 'D:';
    }

    points.push({ x: canvasX, y: canvasY });

    if (points.length === 2) {
        const dx = points[1].x - points[0].x;
        const dy = points[1].y - points[0].y;
        const distInPixels = Math.sqrt(dx * dx + dy * dy);
        const kmPerPixel = mapSizeKm / img.width;
        const distKm = distInPixels * kmPerPixel * 1000;
        document.getElementById('distanceDisplay').innerText = `D: ${distKm.toFixed(2)} m`;
    }

    drawImage();
  });


    // 📱 모바일 핀치줌
    let lastTouchDist = 0;

    canvas.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastTouchDist = Math.sqrt(dx * dx + dy * dy);
        }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();

            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const newDist = Math.sqrt(dx * dx + dy * dy);
            const zoom = newDist / lastTouchDist;

            const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            const x = (centerX - imgX) / imgScale;
            const y = (centerY - imgY) / imgScale;

            const newScale = imgScale * zoom;
            if (newScale < 0.2 || newScale > 10) return;

            imgX -= (x * newScale - x * imgScale);
            imgY -= (y * newScale - y * imgScale);
            imgScale = newScale;

            lastTouchDist = newDist;
            drawImage();
        }
    }, { passive: false });

    // 초기
    resizeCanvas();
    loadImage('img/Erangel_Main_High_Res.webp', 8);
    const column = document.querySelector('.column');
    column.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        column.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  </script>
</body>
</html>
